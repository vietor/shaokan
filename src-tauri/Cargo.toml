[package]
name = "shaokan"
version = "0.1.0"
description = "A lightweight desktop Markdown viewer"
authors = ["Vietor Liu"]
edition = "2021"

[lib]
name = "shaokan_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target."cfg(windows)".dependencies]
webview2-com = "0.39"
windows-core = "0.62"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "z"
strip = true
